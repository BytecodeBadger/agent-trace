[project]
name = "agent-trace"
version = "0.1.0"
description = "Bedrock agent tracing demo with OpenTelemetry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "ipykernel>=6.29",
    "strands-agents>=1.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
